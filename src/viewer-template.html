<!DOCTYPE html>
<!-- Exported by DualDungeonGen — self-contained interactive dungeon map.
     DM/Player toggle · EN/ES toggle · clickable rooms. No dependencies
     except Google Fonts. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--wine:#0e0709;--panel:#171015;--panel2:#1e1519;--gold:#b89857;--gold-dim:#8a744230;
  --bone:#e8dcc6;--dim:#9a8f7d;--line:#3a2e28;--crimson:#b23a2e;--violet:#7d5bb0;--venom:#3f7d4e;--cream:#dccbab;}
*{box-sizing:border-box}
body{margin:0;background:var(--wine);color:var(--bone);font-family:"Crimson Pro",Georgia,serif;font-size:16px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 70% -10%,#1a0e12 0%,transparent 70%);}
header{padding:20px 26px 14px;border-bottom:1px solid var(--line)}
h1{font-family:"Cinzel",serif;font-weight:700;font-size:23px;margin:0;letter-spacing:.02em}
h1 .accent{color:var(--gold)}
.sub{color:var(--dim);font-style:italic;margin-top:3px;font-size:15px}
.badges{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.badge{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.06em;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--gold);background:#00000030}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.06em;padding:9px 16px;background:var(--panel);border:none;color:var(--dim);cursor:pointer;transition:.18s}
.seg button.active{background:var(--gold);color:#1a1206}
.seg.lang button.active{background:var(--line);color:var(--bone)}
.spacer{flex:1}.hint{color:var(--dim);font-size:13px;font-style:italic}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:0}
@media(max-width:900px){main{grid-template-columns:1fr}}
.mapcol{padding:20px 22px;border-right:1px solid var(--line)}
.mapwrap{background:var(--cream);border:1px solid #000;border-radius:6px;overflow:hidden;box-shadow:0 10px 40px #00000060,inset 0 0 60px #0000001a}
svg#map{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--dim);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:14px;height:14px;display:inline-block;border-radius:3px}
.lg-door{background:#f6f3ec;border:1px solid #000}.lg-stairs{background:#6b5d47}
.lg-mon{background:var(--venom);border-radius:50%}.lg-trap{background:var(--crimson);clip-path:polygon(50% 0,100% 100%,0 100%)}
.lg-loot{background:var(--gold);transform:rotate(45deg)}.lg-sec{background:var(--violet)}
.panelcol{padding:20px 22px;min-height:60vh}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h2{font-family:"Cinzel",serif;font-size:16px;margin:0 0 4px;color:var(--gold)}
.card h2 small{color:var(--dim);font-weight:400;font-size:12px;font-style:italic}
.card .read{font-style:italic;color:#d8cdb8;border-left:2px solid var(--gold-dim);padding-left:12px;margin:8px 0}
.row{margin:10px 0 0}.row .lbl{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:14px;margin:2px 4px 2px 0;border:1px solid var(--line)}
.tag.mon{color:#a9e0b8;border-color:#2f5a3a;background:#12241a}
.tac{color:#cdbfa3;font-size:14.5px;margin-top:4px}.muted{color:var(--dim)}
.dmonly{display:none}body.dm .dmonly{display:block}
.notes{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.notes h3{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.06em;color:var(--gold);margin:0 0 8px;text-transform:uppercase}
.notes ul{margin:6px 0 0;padding-left:18px}.notes li{margin:5px 0;font-size:14.5px;color:#cdbfa3}.notes b{color:var(--bone)}
.budget{border-collapse:collapse;font-size:13.5px;margin-top:4px}.budget td{padding:3px 12px 3px 0}
.b-id{color:var(--gold)}.b-diff{color:#e8b0a8}
.bm-hit{cursor:pointer}.bm-hit:hover{fill:rgba(120,60,10,.06)}
.credit{padding:12px 26px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
.credit a{color:var(--gold);text-decoration:none}
</style>
</head>
<body class="dm">
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="badges" id="badges"></div>
</header>
<div class="controls">
  <div class="seg" id="modeToggle">
    <button data-mode="dm" class="active">DM Map</button>
    <button data-mode="player">Player Map</button>
  </div>
  <div class="spacer"></div>
  <span class="hint" id="clickHint">Tap a room for details</span>
  <div class="seg lang" id="langToggle">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="es">ES</button>
  </div>
</div>
<main>
  <div class="mapcol">
    <div class="mapwrap"><svg id="map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="panelcol">
    <div id="panel"></div>
    <div class="notes dmonly" id="dmnotes"></div>
  </div>
</main>
<div class="credit">Made with <a href="#">DualDungeonGen</a></div>

<script>
/*__RENDERER__*/
</script>
<script>
var D = /*__DATA__*/{};
var CH = {
  en:{dm:"DM Map",player:"Player Map",hint:"Tap a room for details",len:"one session",
    door:"Door",entrance:"Entrance",monster:"Monster",trap:"Trap",loot:"Loot",secret:"Secret",
    see:"What you see",mon:"Monsters",trapL:"Trap",lootL:"Loot",tac:"Running it",
    overview:"The Job",notes:"Running it",budget:"Encounter budget",tip:"Switch to Player Map for a clean handout.",party:"× Level"},
  es:{dm:"Mapa del DM",player:"Mapa del jugador",hint:"Toca una sala para ver detalles",len:"una sesión",
    door:"Puerta",entrance:"Entrada",monster:"Monstruo",trap:"Trampa",loot:"Botín",secret:"Secreto",
    see:"Lo que ves",mon:"Monstruos",trapL:"Trampa",lootL:"Botín",tac:"Cómo dirigirlo",
    overview:"El encargo",notes:"Cómo dirigirlo",budget:"Presupuesto de combate",tip:"Cambia al Mapa del jugador para una copia limpia.",party:"× Nivel"}
};
var mode="dm", lang="en", selected=null;
function tx(f){ if(!f) return ""; return f[lang]!=null?f[lang]:f.en; }
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// overview/notes keep intentional <b>/<i>; everything else is neutralised.
function san(s){return esc(s).replace(/&lt;(\/?)(b|i|em|strong)&gt;/gi,"<$1$2>").replace(/&lt;br\s*\/?&gt;/gi,"<br>");}
var mapSvg=document.getElementById("map"), panelEl=document.getElementById("panel"),
    legendEl=document.getElementById("legend"), notesEl=document.getElementById("dmnotes");

function renderMap(){ var r=DDG.renderMapSVG(D,mode,selected); mapSvg.setAttribute("viewBox",r.vb); mapSvg.innerHTML=r.inner; }
function header(){
  var m=D.meta, c=CH[lang];
  var ttl=tx(m.title); var i=ttl.lastIndexOf(" ");
  document.getElementById("title").innerHTML = i>0 ? esc(ttl.slice(0,i))+' <span class="accent">'+esc(ttl.slice(i+1))+'</span>' : esc(ttl);
  document.getElementById("subtitle").textContent=tx(m.subtitle);
  var badge = m.badge?tx(m.badge):(m.theme||"");
  document.getElementById("badges").innerHTML =
    '<span class="badge">'+esc(m.party.size+" "+c.party+" "+m.party.level)+'</span>'+
    '<span class="badge">'+esc((m.difficulty||"")+" · "+c.len)+'</span>'+
    '<span class="badge">'+esc(badge)+'</span>';
}
function overview(){ var c=CH[lang]; panelEl.innerHTML='<div class="card"><h2>'+c.overview+'</h2><p>'+san(tx(D.overview))+'</p><p class="muted" style="font-size:13.5px">'+c.tip+'</p></div>'; }
function showRoom(id){
  var c=CH[lang], r=null; for(var i=0;i<D.rooms.length;i++) if(D.rooms[i].id===id) r=D.rooms[i];
  if(!r||(r.secret&&mode==="player")){ overview(); return; }
  var h='<div class="card"><h2>'+esc(tx(r.name))+' <small>· '+esc(id)+'</small></h2>';
  h+='<div class="row"><span class="lbl">'+c.see+'</span><div class="read">'+esc(tx(r.see))+'</div></div>';
  if(mode==="dm"){
    if(r.mon){ var mm=(r.mon[lang]||r.mon.en)||[]; h+='<div class="row"><span class="lbl">'+c.mon+'</span>'+mm.map(function(x){return '<span class="tag mon">'+esc(x)+'</span>';}).join("")+'</div>'; }
    if(r.trap) h+='<div class="row"><span class="lbl">'+c.trapL+'</span><div class="tac">'+esc(tx(r.trap))+'</div></div>';
    if(r.loot) h+='<div class="row"><span class="lbl">'+c.lootL+'</span><div class="tac">'+esc(tx(r.loot))+'</div></div>';
    if(r.tac)  h+='<div class="row"><span class="lbl">'+c.tac+'</span><div class="tac">'+esc(tx(r.tac))+'</div></div>';
  }
  h+='</div>'; panelEl.innerHTML=h;
}
function legend(){ var c=CH[lang]; var items=[["lg-door",c.door],["lg-stairs",c.entrance]];
  if(mode==="dm") items=items.concat([["lg-mon",c.monster],["lg-trap",c.trap],["lg-loot",c.loot],["lg-sec",c.secret]]);
  legendEl.innerHTML=items.map(function(it){return '<span><i class="'+it[0]+'"></i>'+esc(it[1])+'</span>';}).join(""); }
function notes(){ var c=CH[lang]; var ns=(D.notes&&D.notes[lang])||(D.notes&&D.notes.en)||[];
  var rows=(D.budget||[]).map(function(b){
    var nm=b[1]&&b[1][lang]!=null?b[1][lang]:(b[1]&&b[1].en)||b[1];
    var ct=b[2]&&b[2][lang]!=null?b[2][lang]:(b[2]&&b[2].en)||b[2];
    return '<tr><td class="b-id">'+esc(b[0])+'</td><td>'+esc(nm)+'</td><td style="color:#cdbfa3">'+esc(ct)+'</td><td style="color:var(--dim)">'+esc(b[3])+'</td><td class="b-diff">'+esc(b[4])+'</td></tr>';}).join("");
  notesEl.innerHTML='<h3>'+c.notes+'</h3><ul>'+ns.map(function(n){return '<li>'+san(n)+'</li>';}).join("")+
    '</ul><h3 style="margin-top:14px">'+c.budget+'</h3><table class="budget">'+rows+'</table>'; }
function applyStatic(){ var c=CH[lang];
  document.querySelector('[data-mode="dm"]').textContent=c.dm;
  document.querySelector('[data-mode="player"]').textContent=c.player;
  document.getElementById("clickHint").textContent=c.hint;
  document.documentElement.lang=lang; }
function renderAll(){ document.body.classList.toggle("dm",mode==="dm"); applyStatic(); header(); legend(); notes(); renderMap();
  if(selected&&!(function(){for(var i=0;i<D.rooms.length;i++)if(D.rooms[i].id===selected)return D.rooms[i].secret&&mode==="player";return false;})()) showRoom(selected); else { selected=null; overview(); } }
document.getElementById("modeToggle").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;document.querySelectorAll("#modeToggle button").forEach(function(x){x.classList.toggle("active",x.dataset.mode===mode);});renderAll();});
document.getElementById("langToggle").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  lang=b.dataset.lang;document.querySelectorAll("#langToggle button").forEach(function(x){x.classList.toggle("active",x.dataset.lang===lang);});renderAll();});
mapSvg.addEventListener("click",function(e){var h=e.target.closest("[data-room]");if(!h)return;selected=h.getAttribute("data-room");renderMap();showRoom(selected);});
renderAll();
</script>
</body>
</html>
