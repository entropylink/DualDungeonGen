<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualDungeonGen — Dungeon Map Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#0e0709; --panel:#171015; --panel2:#1e1519; --panel3:#241a1f;
  --gold:#b89857; --gold-hi:#d8b877; --gold-dim:#8a744230;
  --bone:#e8dcc6; --dim:#9a8f7d; --dim2:#6f665a; --line:#3a2e28; --line2:#2a211d;
  --crimson:#b23a2e; --violet:#7d5bb0; --venom:#3f7d4e; --cream:#dccbab;
  --ok:#5a8f5a;
}
*{box-sizing:border-box}
/* The `hidden` attribute must always win — several elements below set an
   author `display` (flex/block) that would otherwise defeat it. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wine);color:var(--bone);
  font-family:"Crimson Pro",Georgia,serif;font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 75% -12%, #1a0e12 0%, transparent 70%);
  -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;color:inherit}
h3{font-family:"Cinzel",serif;font-size:12px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);margin:0 0 10px}
a{color:var(--gold)}

#app{display:flex;flex-direction:column;min-height:100vh}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(#160f13,#120b0f);
  position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-family:"Cinzel",serif;font-weight:700;
  font-size:18px;letter-spacing:.02em;color:var(--bone)}
.brand .brandmark{color:var(--gold)}
.brand .accent{color:var(--gold)}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.topbar .lang{margin-left:auto}

.btn{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.04em;padding:8px 14px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--bone);
  cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.primary{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-hi);color:#1a1206}
.btn.icon{padding:8px 11px;font-size:15px;line-height:1}
.btn.tiny{padding:5px 10px;font-size:11px}
.btn.block{display:block;width:100%;margin-top:6px}
.btn.danger:hover{border-color:var(--crimson);color:#e8a79f}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.menu{position:relative}
.menu-list{position:absolute;top:calc(100% + 6px);left:0;min-width:190px;z-index:50;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 14px 40px #000a}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--bone);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;
  font-family:"Crimson Pro",serif}
.menu-list button:hover{background:var(--panel3);color:var(--gold-hi)}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.05em;padding:7px 13px;
  background:var(--panel);border:none;color:var(--dim);cursor:pointer;transition:.16s}
.seg button.active{background:var(--gold);color:#1a1206}
.seg.lang button.active{background:var(--line);color:var(--bone)}

/* ---------- workspace ---------- */
.workspace{flex:1;display:grid;grid-template-columns:266px minmax(0,1fr) 320px;gap:0;min-height:0}
.sidebar{background:#120b0f;border-color:var(--line);overflow-y:auto;max-height:calc(100vh - 96px)}
.sidebar.left{border-right:1px solid var(--line)}
.sidebar.right{border-left:1px solid var(--line)}
.pane{padding:16px 16px;border-bottom:1px solid var(--line2)}

.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);margin-bottom:4px;font-family:"Cinzel",serif}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:8px 10px;font-size:14px;color:var(--bone)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
.fld textarea{resize:vertical;line-height:1.45}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.seedrow{align-items:stretch}
.seedrow input{flex:1}
.seedrow .btn{white-space:nowrap}

.toolbar{display:flex;gap:6px;margin-bottom:8px}
.tool{width:40px;height:38px;font-size:16px;border:1px solid var(--line);background:var(--panel);
  color:var(--bone);border-radius:8px;cursor:pointer;transition:.14s}
.tool:hover{border-color:var(--gold)}
.tool.active{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.tool.danger.active{background:var(--crimson);border-color:var(--crimson);color:#fff}
.tool-hint{color:var(--dim);font-size:12.5px;font-style:italic;margin:4px 0 8px}
.imgctl input[type=range]{width:100%}

/* ---------- maps ---------- */
.maps{padding:16px 18px;overflow-y:auto;max-height:calc(100vh - 96px)}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1150px){.mapgrid{grid-template-columns:1fr}}
.mapcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 8px 30px #0006}
.mapcard-h{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line2);
  font-family:"Cinzel",serif;font-size:12px;letter-spacing:.05em}
.mapcard-h .dot{width:9px;height:9px;border-radius:50%}
.mapcard-h .dot.dm{background:var(--crimson)}
.mapcard-h .dot.pl{background:var(--venom)}
.mapcard-h .hint{margin-left:auto;color:var(--dim);font-style:italic;font-size:12px;
  font-family:"Crimson Pro",serif;letter-spacing:0}
.mapwrap{position:relative;background:var(--cream);overflow:hidden}
.refimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
svg.ddg-map{display:block;width:100%;height:auto;position:relative}
#wrapDM.tool-draw svg.ddg-map,#wrapDM.tool-connect svg.ddg-map{cursor:crosshair}
#wrapDM.tool-delete svg.ddg-map{cursor:not-allowed}
.bm-hit{cursor:pointer}
.bm-hit:hover{fill:rgba(120,60,10,.06)}
#wrapDM.tool-select .bm-hit{cursor:move}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--dim);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:14px;display:inline-block;border-radius:3px}
.lg-door{background:#f6f3ec;border:1px solid #000}
.lg-stairs{background:#6b5d47}.lg-fire{background:#c0562e}.lg-acid{background:#6f8f5a}
.lg-mon{background:var(--venom);border-radius:50%}
.lg-trap{background:var(--crimson);clip-path:polygon(50% 0,100% 100%,0 100%)}
.lg-loot{background:var(--gold);transform:rotate(45deg)}.lg-sec{background:var(--violet)}

/* ---------- inspector ---------- */
#inspector{padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin-bottom:13px}
.card h2{font-family:"Cinzel",serif;font-size:15px;margin:0 0 4px;color:var(--gold);letter-spacing:.02em}
.card h2 small{color:var(--dim);font-weight:400;font-size:12px;font-style:italic}
.card .read{font-style:italic;color:#d8cdb8;border-left:2px solid var(--gold-dim);padding-left:12px;margin:8px 0}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
.badge{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.05em;padding:4px 9px;border:1px solid var(--line);
  border-radius:20px;color:var(--gold);background:#00000030}
.row{margin:11px 0 0}
.row .lbl{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:4px}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:14px;margin:2px 4px 2px 0;border:1px solid var(--line)}
.tag.mon{color:#a9e0b8;border-color:#2f5a3a;background:#12241a}
.tac{color:#cdbfa3;font-size:14px;margin-top:3px}
.muted{color:var(--dim)}
.dmonly{display:none}
body.dm .dmonly{display:block}
.notes{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:15px 16px}
.notes h3{margin:0 0 8px}
.notes ul{margin:6px 0 0;padding-left:18px}.notes li{margin:5px 0;font-size:13.5px;color:#cdbfa3}
.notes b{color:var(--bone)}
.budget{border-collapse:collapse;font-size:12.5px;margin-top:6px;width:100%}
.budget td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line2)}
.budget .b-id{color:var(--gold);font-family:"Cinzel",serif;font-size:11px}
.budget .b-diff{color:#e8b0a8;white-space:nowrap}

/* editor fields inside inspector */
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.edit-grid .fld{margin:0}
.edit-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);
  cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-hi)}
.chip .x{opacity:.6}
.editmode-on #inspector .editable{outline:1px dashed var(--line);border-radius:6px}

.toggle-edit{float:right;font-size:11px}

/* ---------- status + modal ---------- */
.statusbar{padding:6px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;
  background:#110a0e}
.modal-backdrop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 70px #000c}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);
  font-family:"Cinzel",serif;font-size:15px;color:var(--gold)}
.modal-h .btn{margin-left:auto}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.modal-body textarea{width:100%;min-height:220px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;color:var(--bone);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.modal-note{color:var(--dim);font-size:13px;margin:0 0 10px}
.imgtool{display:grid;grid-template-columns:1fr 230px;gap:16px}
@media(max-width:680px){.imgtool{grid-template-columns:1fr}}
.imgtool canvas{width:100%;background:#0a0608;border:1px solid var(--line);border-radius:8px;cursor:crosshair}
.imgtool .ctrls .fld{margin-bottom:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--dim);
  cursor:pointer}.drop:hover{border-color:var(--gold);color:var(--gold-hi)}

@media(max-width:960px){
  .workspace{grid-template-columns:1fr}
  .sidebar{max-height:none;border-bottom:1px solid var(--line)}
  .sidebar.right{order:3}
  .maps{max-height:none;order:2}
}

</style>
</head>
<body class="dm">
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brandmark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2l3 3-3 3-3-3 3-3zm7 7l3 3-3 3-3-3 3-3zM5 9l3 3-3 3-3-3 3-3zm7 7l3 3-3 3-3-3 3-3z" fill="currentColor"/></svg>
      <span class="brand-txt">DualDungeon<span class="accent">Gen</span></span>
    </div>
    <div class="tb-actions">
      <button id="btnGenerate" class="btn primary" data-t="generate">Generate</button>
      <button id="btnReroll" class="btn icon" title="Re-roll seed" data-t-title="reroll">⟳</button>
      <div class="menu">
        <button class="btn" data-menu="importMenu" data-t="import">Import ▾</button>
        <div class="menu-list" id="importMenu" hidden>
          <button data-imp="json" data-t="imp_json">From JSON…</button>
          <button data-imp="image" data-t="imp_image">From image…</button>
          <button data-imp="ascii" data-t="imp_ascii">Paste grid…</button>
          <button data-imp="blank" data-t="imp_blank">Blank canvas</button>
        </div>
      </div>
      <div class="menu">
        <button class="btn" data-menu="exportMenu" data-t="export">Export ▾</button>
        <div class="menu-list" id="exportMenu" hidden>
          <button data-exp="html" data-t="exp_html">Interactive HTML</button>
          <button data-exp="json" data-t="exp_json">JSON (re-importable)</button>
          <button data-exp="png-dm" data-t="exp_png_dm">PNG · DM map</button>
          <button data-exp="png-pl" data-t="exp_png_pl">PNG · Player map</button>
        </div>
      </div>
    </div>
    <div class="seg lang" id="langToggle">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="es">ES</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar left">
      <section class="pane">
        <h3 data-t="params_h">Parameters</h3>
        <label class="fld"><span data-t="p_theme">Theme</span>
          <select id="pTheme">
            <option value="crafters">Crafters' Guild</option>
            <option value="crypt">Undead Crypt</option>
            <option value="cave">Beast Warren</option>
            <option value="cult">Cult Sanctum</option>
          </select>
        </label>
        <div class="fld-row">
          <label class="fld"><span data-t="p_size">Party size</span>
            <input id="pSize" type="number" min="1" max="12" value="5"></label>
          <label class="fld"><span data-t="p_level">Level</span>
            <input id="pLevel" type="number" min="1" max="20" value="4"></label>
        </div>
        <div class="fld-row">
          <label class="fld"><span data-t="p_rooms">Rooms</span>
            <input id="pRooms" type="number" min="5" max="9" value="7"></label>
          <label class="fld"><span data-t="p_diff">Climax</span>
            <select id="pDiff"><option value="hard" data-t="diff_hard">Hard</option><option value="deadly" data-t="diff_deadly">Deadly</option></select>
          </label>
        </div>
        <label class="fld"><span data-t="p_seed">Seed</span>
          <div class="fld-row seedrow">
            <input id="pSeed" type="number" value="1"><button id="btnRandSeed" class="btn tiny" data-t="random">Random</button>
          </div>
        </label>
        <button id="btnGenerate2" class="btn primary block" data-t="generate_full">Generate dungeon</button>
      </section>

      <section class="pane">
        <h3 data-t="tools_h">Map editor</h3>
        <div class="toolbar" id="toolbar">
          <button class="tool active" data-tool="select" data-t-title="tool_select" title="Select / move">▣</button>
          <button class="tool" data-tool="draw" data-t-title="tool_draw" title="Draw room">▭</button>
          <button class="tool" data-tool="connect" data-t-title="tool_connect" title="Connect rooms">⇆</button>
          <button class="tool" data-tool="secret" data-t-title="tool_secret" title="Toggle secret">✶</button>
          <button class="tool danger" data-tool="delete" data-t-title="tool_delete" title="Delete room">🗑</button>
        </div>
        <p class="tool-hint" id="toolHint" data-t="hint_select">Click a room to select it, then drag to move.</p>
        <label class="fld imgctl" id="imgOpacityWrap" hidden><span data-t="img_opacity">Reference image opacity</span>
          <input id="imgOpacity" type="range" min="0" max="100" value="55"></label>
        <button id="btnClearImg" class="btn tiny block" hidden data-t="img_clear">Remove reference image</button>
      </section>

      <section class="pane collapsible" id="metaPane">
        <h3 data-t="meta_h">Dungeon info</h3>
        <label class="fld"><span data-t="m_title">Title</span><input id="mTitle" type="text"></label>
        <label class="fld"><span data-t="m_sub">Subtitle</span><input id="mSub" type="text"></label>
        <label class="fld"><span data-t="m_overview">Overview / hook</span><textarea id="mOverview" rows="4"></textarea></label>
      </section>
    </aside>

    <main class="maps">
      <div class="mapgrid">
        <div class="mapcard">
          <div class="mapcard-h"><span class="dot dm"></span><span data-t="dm_map">DM Map</span>
            <span class="hint" id="dmHint" data-t="click_hint">Click a room for details</span></div>
          <div class="mapwrap" id="wrapDM">
            <img id="refImg" class="refimg" hidden alt="">
            <svg id="mapDM" class="ddg-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"></svg>
          </div>
        </div>
        <div class="mapcard">
          <div class="mapcard-h"><span class="dot pl"></span><span data-t="player_map">Player Map</span>
            <span class="hint" data-t="handout">Clean handout</span></div>
          <div class="mapwrap">
            <svg id="mapPL" class="ddg-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"></svg>
          </div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </main>

    <aside class="sidebar right">
      <div id="inspector"><!-- populated by app --></div>
    </aside>
  </div>

  <footer class="statusbar"><span id="status" data-t="ready">Ready.</span></footer>
</div>

<!-- generic modal -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><span id="modalTitle">Modal</span><button class="btn icon" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>

          tac: { en: "The ambusher waits disguised, then grapples the looter with adhesive. The hidden way onward is on this room's far wall (DC 15 Investigation).", es: "El emboscador espera disfrazado y luego apresa al saqueador con su adhesivo. El paso oculto está en el muro del fondo (CD 15 Investigación)." } },
        { name: { en: "Material Vault", es: "Bodega de Materiales" }, see: { en: "Shelves of raw stock — ingots, timber, dyes — around a sunken etching-vat of green acid. Something shifts under its surface.", es: "Estantes de materia prima — lingotes, madera, tintes — en torno a una tina hundida de ácido verde. Algo se mueve bajo la superficie." },
          trap: { en: "Acid splash — the narrow ledge is DC 14 Dex or 2d6 acid (corrodes a nonmagical metal item −1).", es: "Salpicadura de ácido — el borde estrecho es CD 14 Des o 2d6 ácido (corroe un objeto de metal no mágico −1)." },
          loot: { en: "A locked strongbox (DC 15): 200 gp and a gold ingot (50 gp).", es: "Una caja fuerte cerrada (CD 15): 200 po y un lingote de oro (50 po)." },
          tac: { en: "The hazard plays dead as raw material, then lashes out — it corrodes weapons, so reward players who spot it first.", es: "El peligro se hace el muerto como material en bruto y luego ataca — corroe armas, así que premia a quien lo detecte primero." } },
        { name: { en: "Glassblowing Hall", es: "Sala de Soplado de Vidrio" }, see: { en: "A cold furnace and racks of half-blown glass, some pieces turning slowly as if on an unseen lathe.", es: "Un horno frío y estantes de vidrio a medio soplar, algunas piezas girando despacio como en un torno invisible." },
          trap: { en: "A rack of glass shards rigged to topple — DC 13 Perception; DC 14 Dex or 2d6 slashing.", es: "Un estante de esquirlas de vidrio listo para volcarse — CD 13 Percepción; CD 14 Des o 2d6 cortante." },
          loot: { en: "A masterwork glass lens (60 gp) and an unfinished wondrous focus.", es: "Una lente de vidrio de obra maestra (60 po) y un foco maravilloso sin terminar." },
          tac: { en: "The animated pieces swarm and shatter for a burst of slashing — brittle but fast; area damage clears them.", es: "Las piezas animadas enjambran y estallan en un golpe cortante — frágiles pero veloces; el daño de área las despeja." } },
        { name: { en: "Engraving Studio", es: "Taller de Grabado" }, see: { en: "Copper plates and burins laid in neat rows. Acid baths line one wall, their surface trembling.", es: "Planchas de cobre y buriles en hileras ordenadas. Cubas de ácido recorren un muro, su superficie temblando." },
          trap: { en: "Etching-acid overflow — DC 14 Dex crossing or 2d6 acid.", es: "Desborde de ácido de grabado — CD 14 Des al cruzar o 2d6 ácido." },
          loot: { en: "Engraving tools and a plate worth 70 gp; a scroll-case with the guild cipher.", es: "Herramientas de grabado y una plancha por 70 po; un tubo con la clave del gremio." },
          tac: { en: "The lurker hides among the plates and lashes at the first to reach the baths — corrosive, so protect metal gear.", es: "El acechador se oculta entre las planchas y ataca al primero que llega a las cubas — corrosivo, así que protege el equipo de metal." } }
      ],
      climax: [{ name: { en: "Masterwork Gallery", es: "Galería de Obras Maestras" }, see: { en: "Columns ring a raised plinth. On it rests the guild's crown achievement in brass and crystal. A tall sentinel stands over it, and its blank face turns toward you.", es: "Columnas rodean un pedestal elevado. Sobre él, la obra cumbre del gremio en latón y cristal. Un alto centinela lo custodia, y su rostro vacío gira hacia ti." },
        trap: { en: "Rune-glyph on the plinth — lifting the prize without the guild-word triggers it: DC 15 Dex, 3d6 force + alarm.", es: "Glifo en el pedestal — alzar el premio sin la palabra-gremio lo activa: CD 15 Des, 3d6 fuerza + alarma." },
        loot: { en: "The masterwork prize — a wondrous item — plus the guild's 500 gp treasure.", es: "El premio maestro — un objeto maravilloso — y el tesoro de 500 po del gremio." },
        tac: { en: "Climax. The guardian holds the plinth and focuses casters; it shrugs off common spells. If the work-room anchor was dealt with, it fights at disadvantage — the payoff for clever play.", es: "Clímax. El guardián protege el pedestal y se centra en los lanzadores; resiste los hechizos comunes. Si trataron el ancla de la sala de trabajo, ataca con desventaja — la recompensa por jugar con astucia." } }],
      secret: [{ name: { en: "Guildmaster's Study", es: "Estudio de la Maestra" }, see: { en: "Behind a false bookcase: a tidy study. A ledger lies open on the desk; a wall-safe hides a private prize.", es: "Tras una estantería falsa: un estudio ordenado. Un libro de cuentas abierto sobre el escritorio; una caja fuerte oculta un premio privado." },
        loot: { en: "The safe (guild seal or DC 15): 300 gp, an Alchemy Jug, a signet. The ledger names the buyer and the guild-word.", es: "La caja (sello o CD 15): 300 po, una Jarra de Alquimia, un sello. El libro nombra al comprador y la palabra-gremio." },
        tac: { en: "No fight. This room is the ‘why’: the ledger turns a crawl into a choice — sell the prize, destroy it, or free the spirit.", es: "Sin combate. Esta sala es el ‘porqué’: el libro convierte el saqueo en una decisión — vender el premio, destruirlo o liberar al espíritu." } }],
      hazard: [{ name: { en: "Storeroom", es: "Almacén" }, see: { en: "Stacked barrels and crates in the half-dark. The floor is slick underfoot and the air smells of rot.", es: "Barriles y cajas apilados en la penumbra. El suelo resbala y el aire huele a podredumbre." },
        trap: { en: "Weakened floorboards — DC 13 Perception; DC 13 Dex or fall 10 ft (1d6) into a debris pit.", es: "Tablas debilitadas — CD 13 Percepción; CD 13 Des o caída de 3 m (1d6) a un foso de escombros." },
        loot: { en: "Salvage worth 40 gp and a flask of alchemist's fire.", es: "Chatarra por 40 po y un frasco de fuego alquímico." },
        tac: { en: "Optional breather with a lurking hazard — an easy fight or a skippable room for pacing.", es: "Respiro opcional con un peligro al acecho — un combate fácil o una sala saltable para el ritmo." } }]
    }
  };
  // Reuse crafters prose shapes for other themes but reskin names/see per role.
  ROLE_PROSE.crypt = {
    entry: [{ name: { en: "Sealed Antechamber", es: "Antecámara Sellada" }, see: { en: "A cold vestibule of carved stone. Grave-dust lies thick, and the broken seal of the tomb hangs off the inner doors. Shapes stand too still against the walls.", es: "Un frío vestíbulo de piedra tallada. El polvo de tumba yace espeso, y el sello roto de la cripta cuelga de las puertas interiores. Formas demasiado quietas contra los muros." }, loot: { en: "Funerary silver (25 gp) and a bronze key marked with the tomb's sigil.", es: "Plata funeraria (25 po) y una llave de bronce con el sigilo de la tumba." }, tac: { en: "Warm-up. The dead here are slow and clumsy — teach the party that undead keep coming until put down for good.", es: "Calentamiento. Los muertos aquí son lentos y torpes — enseña que los no-muertos no paran hasta ser abatidos del todo." } }],
    work: [
      { name: { en: "Niche Gallery", es: "Galería de Nichos" }, see: { en: "Wall-niches hold shrouded remains, tier on tier. The shadows between them do not fall quite right.", es: "Nichos en los muros guardan restos amortajados, hilera sobre hilera. Las sombras entre ellos no caen del todo bien." }, trap: { en: "Collapsing niche — disturbing the wrong shelf drops masonry; DC 14 Dex or 2d8 bludgeoning.", es: "Nicho que se derrumba — perturbar el estante erróneo suelta mampostería; CD 14 Des o 2d8 contundente." }, loot: { en: "Grave-goods worth 60 gp; a vial of holy water tucked in a shroud.", es: "Ofrendas por 60 po; un vial de agua bendita entre las mortajas." }, tac: { en: "The lurkers cling to the dark and drain the isolated — they hate light, so reward torches and radiant damage.", es: "Los acechadores se pegan a la oscuridad y drenan al aislado — odian la luz, así que premia antorchas y daño radiante." } },
      { name: { en: "Reliquary", es: "Relicario" }, see: { en: "Stone sarcophagi under a low vaulted ceiling. One lid sits askew, scraped as if from the inside.", es: "Sarcófagos de piedra bajo una bóveda baja. Una tapa está torcida, raspada como desde dentro." }, trap: { en: "Poison-needle latch on the reliquary — DC 15 Investigation; DC 15 Con or 2d6 poison.", es: "Cerrojo de aguja envenenada en el relicario — CD 15 Investigación; CD 15 Con o 2d6 veneno." }, loot: { en: "A silver holy symbol (75 gp) and a Potion of Healing.", es: "Un símbolo sagrado de plata (75 po) y una Poción de Curación." }, tac: { en: "The occupant bursts from the sarcophagus when the lid is touched — a sudden spike to punish greed.", es: "El ocupante irrumpe del sarcófago al tocar la tapa — un pico súbito para castigar la codicia." } },
      { name: { en: "Ossuary", es: "Osario" }, see: { en: "Bones stacked floor to ceiling in careful patterns. A cold draft stirs them, and they whisper as they settle.", es: "Huesos apilados del suelo al techo en patrones cuidados. Una corriente fría los agita, y susurran al asentarse." }, trap: { en: "Bone-slide — the far arch is rigged; DC 14 Dex or buried for 1d6 bludgeoning and restrained.", es: "Alud de huesos — el arco del fondo está trucado; CD 14 Des o sepultado por 1d6 contundente y apresado." }, loot: { en: "An ancestral signet (50 gp) and 80 gp in grave-coin.", es: "Un sello ancestral (50 po) y 80 po en moneda de tumba." }, tac: { en: "Numbers, not toughness — the horde swamps a lone fighter. Fight in a doorway.", es: "Número, no dureza — la horda ahoga a un luchador solo. Pelea en un umbral." } },
      { name: { en: "Ritual Chancel", es: "Presbiterio Ritual" }, see: { en: "A defiled altar under guttering grave-lamps. Chalk sigils spiral out across the floor, half-finished.", es: "Un altar profanado bajo lámparas de tumba parpadeantes. Sigilos de tiza se despliegan por el piso, a medio terminar." }, trap: { en: "Warding glyph on the altar — DC 15 Arcana to read; crossing unbidden is DC 15 Wis or frightened 1 min.", es: "Glifo de protección en el altar — CD 15 Arcanos para leerlo; cruzar sin permiso es CD 15 Sab o asustado 1 min." }, loot: { en: "Ritual components (100 gp) and a scroll of the rite (clue to the climax).", es: "Componentes rituales (100 po) y un pergamino del rito (pista del clímax)." }, tac: { en: "Interrupting the ritual sigils here weakens the grave-lord's rite at the climax — a clever link worth flagging.", es: "Interrumpir los sigilos aquí debilita el rito del señor de las tumbas en el clímax — un vínculo astuto que conviene señalar." } },
      { name: { en: "Catacomb Stair", es: "Escalera de Catacumbas" }, see: { en: "A spiral of worn steps descends past shelf after shelf of the interred. Cold air pours up from below.", es: "Una espiral de peldaños gastados desciende ante estante tras estante de los sepultados. Aire frío sube desde abajo." }, trap: { en: "A trip-step near the bottom — DC 14 Perception; DC 14 Dex or tumble the flight for 2d6 bludgeoning.", es: "Un peldaño trampa cerca del fondo — CD 14 Percepción; CD 14 Des o rodar el tramo por 2d6 contundente." }, loot: { en: "Grave-tokens worth 70 gp wedged in the niches.", es: "Ofrendas de tumba por 70 po encajadas en los nichos." }, tac: { en: "The dead press from above and below on the stair — hold a landing so they can only come single-file.", es: "Los muertos presionan por arriba y por abajo en la escalera — mantén un rellano para que solo vengan en fila." } },
      { name: { en: "Embalming Room", es: "Sala de Embalsamado" }, see: { en: "Stone slabs, rusted tools, and jars of resin gone black. One slab's straps hang torn.", es: "Losas de piedra, herramientas oxidadas y tarros de resina ennegrecida. Las correas de una losa cuelgan desgarradas." }, trap: { en: "Spilled embalming reagents — a flame turns the floor into a 2d6 fire hazard for 1 round.", es: "Reactivos de embalsamar derramados — una llama vuelve el piso un peligro de fuego de 2d6 por 1 asalto." }, loot: { en: "Silvered instruments (60 gp) and a Potion of Healing in the cabinet.", es: "Instrumentos plateados (60 po) y una Poción de Curación en el gabinete." }, tac: { en: "The occupant rises off a slab when the party's backs are turned — a sudden flank to punish poor marching order.", es: "El ocupante se alza de una losa cuando el grupo da la espalda — un flanqueo súbito para castigar mala formación." } }
    ],
    climax: [{ name: { en: "Grave-Lord's Vault", es: "Cámara del Señor de las Tumbas" }, see: { en: "A domed burial vault. On a raised bier lies a crowned figure, and as you enter it opens its eyes and rises.", es: "Una cámara funeraria abovedada. En un catafalco elevado yace una figura coronada, y al entrar abre los ojos y se alza." }, trap: { en: "Grave-ward on the bier — striking the sleeper before it wakes triggers 3d6 necrotic burst (DC 15 Con half).", es: "Guarda de tumba en el catafalco — golpear al durmiente antes de que despierte lanza un estallido de 3d6 necrótico (CD 15 Con mitad)." }, loot: { en: "The grave-lord's regalia — a wondrous item — and 500 gp in tomb-treasure.", es: "Las insignias del señor de las tumbas — un objeto maravilloso — y 500 po en tesoro de tumba." }, tac: { en: "Climax. It commands the lesser dead and drains life; if the ritual chancel was disrupted it can't call reinforcements. Destroy its anchor to end it for good.", es: "Clímax. Comanda a los muertos menores y drena la vida; si se interrumpió el presbiterio, no puede llamar refuerzos. Destruye su ancla para acabarlo del todo." } }],
    secret: [{ name: { en: "Hidden Reliquary", es: "Relicario Oculto" }, see: { en: "Behind a false tomb-slab: a small sealed chamber, untouched by the rot outside. A record-stone rests on a plinth.", es: "Tras una losa falsa: una pequeña cámara sellada, intacta ante la podredumbre exterior. Una piedra-registro descansa en un pedestal." }, loot: { en: "A reliquary (guild of the dead): 300 gp, a Potion of Greater Healing, and the record-stone naming who broke the seal.", es: "Un relicario: 300 po, una Poción de Curación Mayor, y la piedra-registro que nombra a quien rompió el sello." }, tac: { en: "No fight. The record-stone is the ‘why’ and the key: it tells the party how to lay the grave-lord to rest for good.", es: "Sin combate. La piedra-registro es el ‘porqué’ y la llave: dice cómo dar descanso definitivo al señor de las tumbas." } }],
    hazard: [{ name: { en: "Flooded Crypt", es: "Cripta Inundada" }, see: { en: "Black water fills the sunken floor to the knee. Something disturbs its surface further in.", es: "Agua negra llena el piso hundido hasta la rodilla. Algo perturba su superficie más adentro." }, trap: { en: "Hidden drop-off under the water — DC 13 Perception; DC 13 Dex or plunge into a 10-ft sump (1d6).", es: "Desnivel oculto bajo el agua — CD 13 Percepción; CD 13 Des o caída a un sumidero de 3 m (1d6)." }, loot: { en: "A silt-caked reliquary worth 60 gp.", es: "Un relicario cubierto de limo por 60 po." }, tac: { en: "Optional. The water is difficult terrain and hides a lurker — an easy fight or a skippable breather.", es: "Opcional. El agua es terreno difícil y esconde a un acechador — un combate fácil o un respiro saltable." } }]
  };
  ROLE_PROSE.cave = {
    entry: [{ name: { en: "Cave Mouth", es: "Boca de la Cueva" }, see: { en: "Daylight gives out a few paces in. Gnawed bones and matted fur litter the entry, and small shapes scatter from the light.", es: "La luz del día se acaba a unos pasos. Huesos roídos y pelo apelmazado cubren la entrada, y formas pequeñas huyen de la luz." }, loot: { en: "A traveler's dropped purse (20 gp) among the bones.", es: "La bolsa perdida de un viajero (20 po) entre los huesos." }, tac: { en: "Warm-up. The vermin swarm and flee — teach the party the warren is alive and watching.", es: "Calentamiento. Las alimañas enjambran y huyen — enseña que la madriguera está viva y observa." } }],
    work: [
      { name: { en: "Webbed Hollow", es: "Hueco Entelarañado" }, see: { en: "Thick silk sheets the walls and ceiling, wrapping shapes that might once have moved. Strands twitch as you pass.", es: "Seda espesa cubre muros y techo, envolviendo formas que antes se movían. Las hebras se estremecen al pasar." }, trap: { en: "Sticky web curtain — DC 13 Perception; entering blind is DC 13 Dex or restrained until DC 12 Str.", es: "Cortina de tela pegajosa — CD 13 Percepción; entrar a ciegas es CD 13 Des o apresado hasta CD 12 Fue." }, loot: { en: "A cocooned victim's gear: 60 gp and a Potion of Healing.", es: "El equipo de una víctima encapullada: 60 po y una Poción de Curación." }, tac: { en: "The lurker drops from above onto a webbed target and poisons it. Burning the webs clears the terrain.", es: "El acechador cae desde arriba sobre un objetivo entelado y lo envenena. Quemar las telas despeja el terreno." } },
      { name: { en: "Den", es: "Guarida" }, see: { en: "A fouled nest of hides and dragged carcasses. The reek is overpowering and the far dark growls.", es: "Un nido inmundo de pieles y despojos arrastrados. El hedor es abrumador y la oscuridad del fondo gruñe." }, trap: { en: "Loose scree slope — DC 14 Dex crossing or slide prone into the den (rousing its keeper).", es: "Pendiente de grava suelta — CD 14 Des al cruzar o resbalar derribado a la guarida (despertando a su dueño)." }, loot: { en: "Swallowed valuables in the muck — 90 gp and a gold locket (25 gp).", es: "Objetos tragados en el fango — 90 po y un guardapelo de oro (25 po)." }, tac: { en: "The beast defends its nest ferociously and fights to the death here — use the terrain to split it from the party.", es: "La bestia defiende su nido con ferocidad y pelea a muerte aquí — usa el terreno para separarla del grupo." } },
      { name: { en: "Sinkhole", es: "Sumidero" }, see: { en: "The floor falls away into a wet pit ringed by a slick ledge. Wingbeats echo up from below.", es: "El piso cae a un foso húmedo rodeado de un borde resbaladizo. Aleteos resuenan desde abajo." }, trap: { en: "Crumbling ledge — DC 14 Dex or fall 15 ft (1d6) into the pit with whatever waits there.", es: "Borde que se desmorona — CD 14 Des o caída de 4,5 m (1d6) al foso con lo que aguarde ahí." }, loot: { en: "A hunter's lost pack at the pit bottom: 70 gp and a coil of silk rope.", es: "El morral perdido de un cazador al fondo: 70 po y una cuerda de seda." }, tac: { en: "Flyers use the vertical space — they harry from the dark and retreat upward. Ranged parties shine here.", es: "Los voladores usan el espacio vertical — hostigan desde la oscuridad y se retiran hacia arriba. Los grupos a distancia lucen aquí." } },
      { name: { en: "Fungal Gallery", es: "Galería de Hongos" }, see: { en: "Pale luminous fungus climbs the walls. A shallow pool reflects the glow, and the air is heavy and spore-thick.", es: "Hongos pálidos y luminosos trepan los muros. Una charca poco honda refleja el brillo, y el aire es pesado y cargado de esporas." }, trap: { en: "Burst-spore puffballs — DC 13 Perception; treading on one is DC 13 Con or poisoned 1 min.", es: "Bejines de esporas — CD 13 Percepción; pisar uno es CD 13 Con o envenenado 1 min." }, loot: { en: "Rare alchemical fungus worth 80 gp to the right buyer.", es: "Hongo alquímico raro por 80 po al comprador correcto." }, tac: { en: "The dweller camouflages against the fungus and ambushes — the pool is difficult terrain that funnels the fight.", es: "El morador se camufla entre los hongos y embosca — la charca es terreno difícil que encauza el combate." } },
      { name: { en: "Root Chamber", es: "Cámara de Raíces" }, see: { en: "Great tree-roots pierce the ceiling and cage the room. Something small chitters where they knot together.", es: "Grandes raíces perforan el techo y enjaulan la sala. Algo pequeño chirría donde se anudan." }, trap: { en: "Root snare — DC 13 Perception; stepping wrong is DC 13 Dex or hoisted and restrained (DC 12 Str to break free).", es: "Lazo de raíces — CD 13 Percepción; pisar mal es CD 13 Des o izado y apresado (CD 12 Fue para soltarse)." }, loot: { en: "A nest of swallowed coins and trinkets — 70 gp.", es: "Un nido de monedas y chucherías tragadas — 70 po." }, tac: { en: "Climbers use the roots for cover and high ground — smoke or fire flushes them down.", es: "Los trepadores usan las raíces como cobertura y altura — humo o fuego los hace bajar." } },
      { name: { en: "Underground Stream", es: "Arroyo Subterráneo" }, see: { en: "A cold stream cuts the cavern, loud enough to swallow footsteps. Pale things dart under the surface.", es: "Un arroyo frío corta la caverna, tan sonoro que traga las pisadas. Cosas pálidas se lanzan bajo la superficie." }, trap: { en: "Slick bank — DC 13 Dex or slip prone into the current and be swept 15 ft.", es: "Ribera resbaladiza — CD 13 Des o resbalar derribado a la corriente y ser arrastrado 4,5 m." }, loot: { en: "A drowned traveler's pack: 60 gp and a Potion of Water Breathing.", es: "El morral de un viajero ahogado: 60 po y una Poción de Respirar Bajo el Agua." }, tac: { en: "The current is difficult terrain and masks sound — the ambusher strikes from the water; ranged attackers own the far bank.", es: "La corriente es terreno difícil y enmascara el sonido — el emboscador ataca desde el agua; los atacantes a distancia dominan la orilla opuesta." } }
    ],
    climax: [{ name: { en: "The Deep Den", es: "La Guarida Honda" }, see: { en: "The warren opens into a high cavern strewn with the bones of its prey. Something enormous uncurls in the dark and turns to face you.", es: "La madriguera se abre a una caverna alta sembrada con los huesos de sus presas. Algo enorme se despliega en la oscuridad y se vuelve hacia ti." }, trap: { en: "Bone-strewn ground is difficult terrain; a false floor over a den-pit drops the unwary (DC 15 Dex, 2d6).", es: "El suelo de huesos es terreno difícil; un piso falso sobre un foso hunde al incauto (CD 15 Des, 2d6)." }, loot: { en: "The beast's hoard — a wondrous item swallowed long ago — and 500 gp in scattered valuables.", es: "El tesoro de la bestia — un objeto maravilloso tragado hace mucho — y 500 po en objetos dispersos." }, tac: { en: "Climax. It hits hard and grapples; if the den pack was thinned first, it fights alone. Fire and the cavern's ledges are your friends.", es: "Clímax. Golpea fuerte y apresa; si se diezmó la manada antes, pelea sola. El fuego y los salientes de la caverna son tus aliados." } }],
    secret: [{ name: { en: "Smuggler's Cache", es: "Alijo de Contrabandistas" }, see: { en: "Behind a curtain of roots: a dry crevice someone once used to hide goods. Crates sit stacked and forgotten.", es: "Tras una cortina de raíces: una grieta seca que alguien usó para esconder mercancía. Cajas apiladas y olvidadas." }, loot: { en: "The cache (DC 14 to find): 300 gp, a Potion of Greater Healing, and a map marking who stashed it here.", es: "El alijo (CD 14 para hallarlo): 300 po, una Poción de Curación Mayor, y un mapa que marca quién lo escondió aquí." }, tac: { en: "No fight. The map is the ‘why’ — it ties the warren to whoever's been feeding it, and points at a bigger job.", es: "Sin combate. El mapa es el ‘porqué’ — liga la madriguera con quien la ha estado alimentando, y apunta a un trabajo mayor." } }],
    hazard: [{ name: { en: "Choked Passage", es: "Pasaje Obstruido" }, see: { en: "The way narrows to a crawl through fallen rock. Skittering echoes from the cracks all around.", es: "El paso se estrecha a un gateo entre roca caída. Ecos de patas resuenan en las grietas alrededor." }, trap: { en: "Unstable ceiling — a loud noise brings it down; DC 14 Dex or 2d6 bludgeoning and half-buried.", es: "Techo inestable — un ruido fuerte lo derrumba; CD 14 Des o 2d6 contundente y medio sepultado." }, loot: { en: "A prospector's dropped satchel: 40 gp of ore samples.", es: "El zurrón perdido de un buscador: 40 po en muestras de mineral." }, tac: { en: "Optional. Cramped quarters and a swarm — an easy fight or a tension beat between bigger rooms.", es: "Opcional. Espacio angosto y un enjambre — un combate fácil o un momento de tensión entre salas mayores." } }]

/* ============================================================
   DualDungeonGen — AI PROVIDERS + AI PANEL
   Two ways to generate, in priority order:

   1. **Claude Code bridge** (localhost:8824) — only exists when the
      person viewing the page runs `node ddg-server.js` on their own
      machine with their own logged-in Claude Code. On the public
      website this simply isn't reachable, so the site can never use
      the owner's Claude Code.

   2. **BYOK (bring your own key)** — Anthropic / OpenAI / Gemini.
      The key is entered by the user, stored ONLY in this browser's
      localStorage, and every request goes DIRECTLY from the browser
      to the provider (no server of ours ever sees or proxies it).
      Each user spends only their own key, only from their own browser.

   - generateContent: geometry is FIXED (exact rooms already detected);

      adjacency && adjacency.length ? "\nDOOR CONNECTIONS (rooms joined by a door): " + adjacency.join(", ") : "",

      "PARTY: " + party.size + " PCs, level " + party.level + " (D&D 5e).",
      "USER'S DESCRIPTION OF THE ENVIRONMENT (honor it literally — theme, difficulty, mechanics, monsters or lack of them):",
      '"' + (guidance || "a classic dungeon crawl") + '"',

      "Write bilingual content (en + es; the Spanish must be natural Mexican-Spanish RPG prose using PJ/PX, CD, VD, Percepción...).",

  function visionPrompt(guidance, party) {
    return [

      "Trace ONLY the 6-14 major rooms/chambers as polygons of normalized [x,y] points (0..1 fractions of the image,",
      "origin top-left), hugging each room's real walls. 4 points for rectangular rooms, 5-12 for irregular ones.",
      "NEVER box individual grid tiles or thin corridors as rooms.",
      "",
      "PARTY: " + party.size + " PCs, level " + party.level + " (D&D 5e).",
      "USER'S DESCRIPTION (honor it literally): \"" + (guidance || "a classic dungeon crawl") + '"',
      "",
      "Then write bilingual (en+es, natural Spanish) adventure content for those rooms. `see` = sensory player text,",
      "no spoilers. `tac` = 2nd-person DM advice. SRD monsters with CR scaled to the party. Do NOT output meta.image.",
      "",
      "Reply with ONLY this JSON (no prose, no fences):",
      '{"meta":{"title":{"en","es"},"subtitle":{"en","es"},"badge":{"en","es"},"party":{"size":' + party.size + ',"level":' + party.level + '},"difficulty":"Medium"},',
      ' "entry":"A",',
      ' "rooms":[{"id":"A","poly":[[0.06,0.42],[0.26,0.42],[0.26,0.60],[0.06,0.60]],"secret":false,"name":{"en","es"},"see":{"en","es"},"mon":{"en":[],"es":[]},"trap":{"en","es"},"loot":{"en","es"},"tac":{"en","es"}},...],',

  // ---------------- JSON extraction ---------------------------------------
  function truncMsg() {
    return L() === "es"
      ? "respuesta truncada (mapa muy grande para el límite del modelo) — usa menos cuartos o un modelo con más salida"
      : "response truncated (map too large for the model's token limit) — try fewer rooms or a higher-output model";
  }
  function extractJSON(text) {
    if (!text) throw new Error("empty AI response");
    var t = String(text).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b <= a) throw new Error("no JSON in response");
    return JSON.parse(t.slice(a, b + 1));
  }

  // ---------------- provider calls (direct from the browser) --------------
  function callAnthropic(key, model, prompt, imageDataUrl) {
    var content = [];
    if (imageDataUrl) {
      var m = /^data:(image\/\w+);base64,(.*)$/.exec(imageDataUrl);
      if (m) content.push({ type: "image", source: { type: "base64", media_type: m[1], data: m[2] } });
    }
    content.push({ type: "text", text: prompt });
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: model, max_tokens: 16000, messages: [{ role: "user", content: content }] })
    }).then(handleHttp).then(function (j) {
      if (j.stop_reason === "max_tokens") throw new Error(truncMsg());
      var txt = (j.content || []).map(function (c) { return c.text || ""; }).join("");
      return extractJSON(txt);
    });

  function callOpenAI(key, model, prompt, imageDataUrl) {
    var user = imageDataUrl
      ? [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: imageDataUrl } }]
      : prompt;
    return fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json", "authorization": "Bearer " + key },
      body: JSON.stringify({
        model: model, max_tokens: 16000,
        response_format: { type: "json_object" },

          { role: "system", content: "You reply with a single valid JSON object and nothing else." },
          { role: "user", content: user }

      var ch = j.choices && j.choices[0];

  function callGemini(key, model, prompt, imageDataUrl) {

      method: "POST",

/* ===== 09-cartografo-rooms.js ===== */
/* ============================================================
   DualDungeonGen — EXACT ROOM DETECTION from Cartógrafo data
   Input: the Cartógrafo de Mazmorras save JSON (v4) + the export
   bounds used to render its PNG. Output: rooms as EXACT polygon
   outlines (normalized 0..1 against that same PNG), plus hints
   (water, stairs, props, labels, door adjacency) for the AI.

   Deterministic — no vision, no approximation:
   - flood-fill floor/water cells, passage blocked where the
     center-to-center segment crosses a wall or door segment
     (same geometric rule the Cartógrafo itself uses);
   - each connected component = one room;
   - its boundary is traced along the exact cell edges and
     normalized with the SAME bounds the PNG was rendered with,
     so overlays align pixel-perfect.
   ============================================================ */
(function (root) {
  "use strict";
  var DDG = root.DDG || (root.DDG = {});

  // ---- segment intersection --------------------------------------------
  // EXACT same rule as the Cartógrafo's own segIntersect/crossesWall
  // (zero-orientation groups with the negative side), so room detection
  // agrees with how the app's own flood/bucket behaves — including cells
  // whose center lies ON a diagonal wall.
  function orient(ax, ay, bx, by, cx, cy) {
    return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  }
  function segsCross(a, b, c, d) {
    var o1 = orient(a.x, a.y, b.x, b.y, c.x, c.y), o2 = orient(a.x, a.y, b.x, b.y, d.x, d.y);
    var o3 = orient(c.x, c.y, d.x, d.y, a.x, a.y), o4 = orient(c.x, c.y, d.x, d.y, b.x, b.y);
    return ((o1 > 0) !== (o2 > 0)) && ((o3 > 0) !== (o4 > 0));
  }

  // ---- passage test ------------------------------------------------------
  // Blockers = walls + doors (a door separates two rooms). Segments with
  // zero length are ignored. Cell centers are (x+.5, y+.5).
  function makeBlockTest(walls, doors) {
    var segs = [];
    (walls || []).concat(doors || []).forEach(function (w) {
      if (w && (w.x1 !== w.x2 || w.y1 !== w.y2)) segs.push(w);
    });
    // coarse spatial hash so big maps stay fast
    var grid = {};
    segs.forEach(function (s, i) {
      var mnx = Math.floor(Math.min(s.x1, s.x2)), mxx = Math.floor(Math.max(s.x1, s.x2));
      var mny = Math.floor(Math.min(s.y1, s.y2)), mxy = Math.floor(Math.max(s.y1, s.y2));
      for (var gx = mnx - 1; gx <= mxx + 1; gx++)
        for (var gy = mny - 1; gy <= mxy + 1; gy++) {
          var k = gx + "," + gy; (grid[k] || (grid[k] = [])).push(i);
        }
    });
    return function blocked(ax, ay, bx, by) {
      var a = { x: ax + 0.5, y: ay + 0.5 }, b = { x: bx + 0.5, y: by + 0.5 };
      var k1 = ax + "," + ay, k2 = bx + "," + by, seen = {};
      var lists = [grid[k1], grid[k2]];
      for (var li = 0; li < lists.length; li++) {
        var L = lists[li]; if (!L) continue;
        for (var i = 0; i < L.length; i++) {
          var idx = L[i]; if (seen[idx]) continue; seen[idx] = 1;
          var s = segs[idx];
          if (segsCross(a, b, { x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 })) return true;
        }
      }
      return false;
    };
  }

  // ---- connected components ---------------------------------------------
  function components(cellKeys, blocked) {
    var inSet = {}; cellKeys.forEach(function (k) { inSet[k] = 1; });
    var seen = {}, comps = [];
    var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    cellKeys.forEach(function (start) {
      if (seen[start]) return;
      var q = [start], comp = []; seen[start] = 1;
      while (q.length) {
        var k = q.pop(); comp.push(k);
        var p = k.split(","), x = +p[0], y = +p[1];
        for (var d = 0; d < 4; d++) {
          var nx = x + DIRS[d][0], ny = y + DIRS[d][1], nk = nx + "," + ny;
          if (!inSet[nk] || seen[nk]) continue;
          if (blocked(x, y, nx, ny)) continue;
          seen[nk] = 1; q.push(nk);
        }
      }
      comps.push(comp);
    });
    return comps;
  }

  // ---- boundary tracing ---------------------------------------------------
  // Directed edges (interior kept on a consistent side); chained into loops;
  // the loop with the largest area is the outer boundary. Collinear points
  // are merged so a straight wall is 2 points, not 20.
  function tracePolygon(comp) {
    var inC = {}; comp.forEach(function (k) { inC[k] = 1; });
    var edges = {}; // "x,y" start -> array of [ex,ey]
    function addEdge(sx, sy, ex, ey) { var k = sx + "," + sy; (edges[k] || (edges[k] = [])).push([ex, ey]); }
    comp.forEach(function (k) {
      var p = k.split(","), x = +p[0], y = +p[1];
      if (!inC[x + "," + (y - 1)]) addEdge(x, y, x + 1, y);           // top  →E
      if (!inC[(x + 1) + "," + y]) addEdge(x + 1, y, x + 1, y + 1);   // right→S
      if (!inC[x + "," + (y + 1)]) addEdge(x + 1, y + 1, x, y + 1);   // bot  →W
      if (!inC[(x - 1) + "," + y]) addEdge(x, y + 1, x, y);           // left →N
    });
    var loops = [];
    var startKeys = Object.keys(edges);
    for (var si = 0; si < startKeys.length; si++) {
      var sk = startKeys[si];
      while (edges[sk] && edges[sk].length) {
        var sp = sk.split(","), cx = +sp[0], cy = +sp[1];
        var loop = [[cx, cy]];
        var cur = edges[sk].pop();
        var px = cx, py = cy;
        var guard = 0;
        while (guard++ < 100000) {
          var vx = cur[0], vy = cur[1];
          if (vx === loop[0][0] && vy === loop[0][1]) break; // closed
          loop.push([vx, vy]);
          var outs = edges[vx + "," + vy];
          if (!outs || !outs.length) { loop = null; break; } // broken chain (shouldn't happen)
          var next;
          if (outs.length === 1) next = outs.pop();
          else {
            // pinch vertex: prefer the sharpest turn toward the interior
            // (right turn in y-down coords) so we stay on the same loop
            var inx = vx - px, iny = vy - py, best = -1, bestScore = -Infinity;
            for (var oi = 0; oi < outs.length; oi++) {
              var ox = outs[oi][0] - vx, oy = outs[oi][1] - vy;
              var cross = inx * oy - iny * ox;      // >0 = right turn (y down)
              var dot = inx * ox + iny * oy;
              var score = cross > 0 ? 2 : (cross === 0 && dot > 0 ? 1 : 0);
              if (score > bestScore) { bestScore = score; best = oi; }
            }
            next = outs.splice(best, 1)[0];
          }
          px = vx; py = vy; cur = next;
        }
        if (loop && loop.length >= 3) loops.push(loop);
      }
    }
    if (!loops.length) return null;
    // outer loop = max |shoelace area|
    var bestLoop = loops[0], bestA = -1;
    loops.forEach(function (L) {
      var a = 0;
      for (var i = 0; i < L.length; i++) { var j = (i + 1) % L.length; a += L[i][0] * L[j][1] - L[j][0] * L[i][1]; }
      a = Math.abs(a / 2);
      if (a > bestA) { bestA = a; bestLoop = L; }
    });
    // merge collinear runs
    var out = [];
    for (var i2 = 0; i2 < bestLoop.length; i2++) {
      var A = bestLoop[(i2 + bestLoop.length - 1) % bestLoop.length], B = bestLoop[i2], C = bestLoop[(i2 + 1) % bestLoop.length];
      if ((B[0] - A[0]) * (C[1] - B[1]) - (B[1] - A[1]) * (C[0] - B[0]) !== 0) out.push(B);
    }
    return out.length >= 3 ? out : bestLoop;
  }

  // ---- main entry ---------------------------------------------------------
  // data:   Cartógrafo save JSON (v4) — cells [[key,{t,..}],..], walls, doors,
  //         stairs, objects, labels, assets
  // bounds: {minX,minY,maxX,maxY} in cell coords — MUST be the same bounds
  //         the PNG was rendered with (padB(contentBounds(),1)).
  function roomsFromCartografo(data, bounds) {
    var cells = new Map(data.cells || []);
    var keys = [...cells.keys()];
    if (!keys.length) return { rooms: [], adjacency: [] };
    var blocked = makeBlockTest(data.walls, data.doors);
    var comps = components(keys, blocked).filter(function (c) { return c.length >= 1; });
    comps.sort(function (a, b) { return b.length - a.length; });

    var bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
    function norm(pt) {
      return [Math.round((pt[0] - bounds.minX) / bw * 10000) / 10000,
              Math.round((pt[1] - bounds.minY) / bh * 10000) / 10000];
    }
    function cellRoomIndex(x, y) {
      var k = Math.floor(x) + "," + Math.floor(y);
      for (var i = 0; i < comps.length; i++) if (compSets[i][k]) return i;
      return -1;
    }
    var compSets = comps.map(function (c) { var s = {}; c.forEach(function (k) { s[k] = 1; }); return s; });

    // asset names for object hints
    var objNames = {};
    ((data.assets && data.assets.object) || []).forEach(function (a) { objNames[a.id] = a.name || ""; });

    var rooms = comps.map(function (comp, i) {
      var poly = tracePolygon(comp);
      var id = i < 26 ? String.fromCharCode(65 + i) : "R" + (i + 1);
      var water = false;
      comp.forEach(function (k) { var c = cells.get(k); if (c && c.t === "water") water = true; });
      return {
        id: id,
        poly: poly ? poly.map(norm) : null,
        cells: comp.length,
        sizeFt2: Math.round(comp.length * 6.25), // cell = 2.5ft → 6.25 ft²
        water: water,
        stairs: 0, props: [], labels: []
      };
    }).filter(function (r) { return r.poly && r.poly.length >= 3; });

    // hints: stairs / props / labels by position
    (data.stairs || []).forEach(function (s) {
      var mx = (s.x1 + s.x4) / 2, my = (s.y1 + s.y4) / 2;
      var ri = cellRoomIndex(mx, my); if (ri >= 0 && rooms[ri]) rooms[ri].stairs++;
    });
    (data.objects || []).forEach(function (o) {
      var ri = cellRoomIndex(o.x, o.y);
      if (ri >= 0 && rooms[ri]) { var n = objNames[o.a]; if (n && rooms[ri].props.indexOf(n) < 0) rooms[ri].props.push(n); }
    });
    (data.labels || []).forEach(function (l) {
      var ri = cellRoomIndex(l.x, l.y);
      if (ri >= 0 && rooms[ri] && l.text) rooms[ri].labels.push(l.text);
    });

    // door adjacency: which two rooms each door separates
    var adjacency = [];
    (data.doors || []).forEach(function (d) {
      var mx = (d.x1 + d.x2) / 2, my = (d.y1 + d.y2) / 2;
      var vert = Math.abs(d.x2 - d.x1) < Math.abs(d.y2 - d.y1);
      var a, b;
      if (vert) { a = cellRoomIndex(mx - 0.5, my); b = cellRoomIndex(mx + 0.5, my); }
      else { a = cellRoomIndex(mx, my - 0.5); b = cellRoomIndex(mx, my + 0.5); }
      if (a >= 0 && b >= 0 && a !== b && rooms[a] && rooms[b]) {
        var pair = [rooms[a].id, rooms[b].id].sort().join("-");
        if (adjacency.indexOf(pair) < 0) adjacency.push(pair);
      }
    });

    return { rooms: rooms, adjacency: adjacency };
  }

  DDG.roomsFromCartografo = roomsFromCartografo;
  DDG._cartoInternals = { segsCross: segsCross, makeBlockTest: makeBlockTest, components: components, tracePolygon: tracePolygon };
  if (typeof module !== "undefined" && module.exports) module.exports = { roomsFromCartografo: roomsFromCartografo };
})(typeof window !== "undefined" ? window : globalThis);


/* ===== 10-integration.js ===== */
/* ============================================================
   DualDungeonGen — SHELL INTEGRATION (receive maps from Cartógrafo)
   The tab shell relays {type:"ddg-map", png, bounds, ppc, data} here.
   Flow:
     1. detect rooms EXACTLY from the Cartógrafo data (09 module) —
        the PNG is the map, polys align 1:1 by construction;
     2. load it immediately as an image-backed dungeon (clickable now);
     3. open the "describe the environment" dialog → AI writes ONLY
        the content (names, player/DM notes, monsters, traps, budget)
        via DDG.ai (bridge or BYOK) and it's merged room by room.
   ============================================================ */
(function (root) {
  "use strict";
  var DDG = root.DDG || (root.DDG = {});
  if (typeof document === "undefined") return;

  var lastRooms = null, lastAdjacency = null;

  var L = function () { return (DDG.app && DDG.app.lang && DDG.app.lang()) || "en"; };
  var T = {
    en: {
      received: "Map received from the Cartógrafo — %s rooms detected exactly.",
      dlgTitle: "Describe the environment", guide: "What is this dungeon? (theme, difficulty, mechanics, monsters or none…)",
      ph: "an abandoned dwarven mine reclaimed by kobolds, medium difficulty, a couple of traps, one mini-boss",
      size: "Party size", level: "Level", gen: "Generate notes with AI", geomOnly: "Geometry only (fill by hand)",
      tip: "Tip: rooms are split by doors and walls. One giant space? Add doors in the Cartógrafo and re-send.",
      working: "Writing the adventure…", genErr: "Generation failed: ", genOk: "Notes generated — click any room.",
      noprov: "No AI available: run the local bridge or save an API key in the AI panel.", roomN: "Room", cancel: "Cancel"
    },
    es: {
      received: "Mapa recibido del Cartógrafo — %s cuartos detectados exactamente.",
      dlgTitle: "Describe el ambiente", guide: "¿De qué va esta mazmorra? (tema, dificultad, mecánicas, monstruos o ninguno…)",
      ph: "una mina enana abandonada tomada por kobolds, dificultad media, un par de trampas, un mini-jefe",
      size: "Tamaño del grupo", level: "Nivel", gen: "Generar notas con IA", geomOnly: "Solo geometría (llenar a mano)",
      tip: "Tip: los cuartos se separan por puertas y muros. ¿Un solo espacio gigante? Pon puertas en el Cartógrafo y reenvía.",
      working: "Escribiendo la aventura…", genErr: "Falló la generación: ", genOk: "Notas generadas — haz clic en cualquier cuarto.",
      noprov: "Sin IA disponible: corre el puente local o guarda una clave API en el panel de IA.", roomN: "Sala", cancel: "Cancelar"
    }
  };
  function t(k) { return (T[L()] && T[L()][k]) || T.en[k]; }
  function fmt(s, v) { return s.replace("%s", v); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  // ---- build the exact image-backed dungeon from a shell message --------
  function dungeonFromMessage(msg) {
    var det = DDG.roomsFromCartografo(msg.data, msg.bounds);
    lastRooms = det.rooms; lastAdjacency = det.adjacency;
    var w = msg.bounds.maxX - msg.bounds.minX, h = msg.bounds.maxY - msg.bounds.minY;
    var entry = null;
    det.rooms.forEach(function (r) { if (!entry && r.stairs) entry = r.id; });
    if (!entry && det.rooms.length) entry = det.rooms[0].id;
    var rooms = det.rooms.map(function (r) {
      var name = (r.labels && r.labels[0]) ? { en: r.labels[0], es: r.labels[0] }
        : { en: "Room " + r.id, es: "Sala " + r.id };
      return { id: r.id, poly: r.poly, secret: false, feats: [], name: name, see: { en: "", es: "" } };
    });
    return {
      format: "ddg-dungeon", version: 1,
      meta: {
        title: { en: "Cartógrafo Map", es: "Mapa del Cartógrafo" },
        subtitle: { en: "", es: "" }, theme: "custom",
        party: { size: 4, level: 3 }, cell: 26,
        badge: { en: "Exact Map", es: "Mapa Exacto" }, difficulty: "Medium",
        image: msg.png, imageAspect: h / w, imageOpacity: 1
      },
      entry: entry, rooms: rooms, corridors: [],
      overview: { en: "", es: "" }, notes: { en: [], es: [] }, budget: []
    };
  }

  function handleMap(msg) {
    try {
      var D = DDG.importers.coerce(dungeonFromMessage(msg));
      DDG.app.setD(D);
      DDG.app.status(fmt(t("received"), D.rooms.length));
      if (DDG.ai && DDG.ai.refreshPanel) DDG.ai.refreshPanel();
      openDescribe();
    } catch (e) {
      DDG.app.status("Import error: " + e.message);
    }
  }

  // ---- describe dialog ----------------------------------------------------
  function openDescribe() {
    var D = DDG.app.D; if (!D) return;
    if (DDG.ai && DDG.ai.probe) DDG.ai.probe(); // pick up a just-started local bridge
    var party = D.meta.party || { size: 4, level: 3 };
    var body =
      '<label class="fld"><span>' + t("guide") + '</span>' +
      '<textarea id="dscGuide" rows="4" placeholder="' + esc(t("ph")) + '"></textarea></label>' +
      '<div class="fld-row">' +
      '<label class="fld"><span>' + t("size") + '</span><input id="dscSize" type="number" min="1" max="12" value="' + party.size + '"></label>' +
      '<label class="fld"><span>' + t("level") + '</span><input id="dscLevel" type="number" min="1" max="20" value="' + party.level + '"></label>' +
      "</div>" +
      '<p class="modal-note">' + t("tip") + "</p>" +
      '<p class="tool-hint" id="dscStatus"></p>';
    DDG.app.modal(t("dlgTitle"), body, [
      { label: t("geomOnly"), onClick: function () { DDG.app.closeModal(); } },
      { label: t("gen"), primary: true, onClick: runGeneration }
    ]);
  }

  function runGeneration() {
    var D = DDG.app.D; if (!D) return;
    if (!DDG.ai || !DDG.ai.status().ready) { setDlgStatus(t("noprov"), true); return; }
    if (!lastRooms) { // dungeon didn't come from the Cartógrafo this session — derive facts from D
      lastRooms = D.rooms.map(function (r) {
        return { id: r.id, sizeFt2: 0, water: false, stairs: 0, props: [], labels: [DDG.app.tx(r.name)].filter(Boolean) };
      });
      lastAdjacency = [];
    }
    var guidance = (document.getElementById("dscGuide").value || "").trim();
    var party = {
      size: parseInt(document.getElementById("dscSize").value, 10) || 4,
      level: parseInt(document.getElementById("dscLevel").value, 10) || 3
    };
    D.meta.party = party;
    var t0 = Date.now();
    var tick = setInterval(function () { setDlgStatus(t("working") + " (" + Math.round((Date.now() - t0) / 1000) + "s)"); }, 1000);
    setDlgStatus(t("working"));
    lockDlg(true);
    DDG.ai.generateContent({ rooms: lastRooms, adjacency: lastAdjacency, guidance: guidance, party: party })
      .then(function (content) {
        clearInterval(tick);
        mergeContent(D, content);
        DDG.app.closeModal();
        DDG.app.render();
        DDG.app.status(t("genOk") + " (" + Math.round((Date.now() - t0) / 1000) + "s)");
      })
      .catch(function (e) {
        clearInterval(tick); lockDlg(false);
        setDlgStatus(t("genErr") + (e.message === "no-provider" ? t("noprov") : e.message), true);
      });
  }
  function setDlgStatus(msg, isErr) {
    var el = document.getElementById("dscStatus"); if (!el) return;
    el.textContent = msg; el.style.color = isErr ? "var(--crimson)" : "var(--gold)";
  }
  function lockDlg(on) {
    document.querySelectorAll("#modalFoot .btn").forEach(function (b) { b.disabled = on; });
  }

  // ---- merge AI content into the geometric dungeon ------------------------
  function bil(x) {
    if (x == null) return null;
    if (typeof x === "string") return { en: x, es: x };
    return { en: x.en != null ? x.en : x.es, es: x.es != null ? x.es : x.en };
  }
  function mergeContent(D, c) {
    if (!c || typeof c !== "object") throw new Error("bad content JSON");
    if (c.meta) {
      if (c.meta.title) D.meta.title = bil(c.meta.title);
      if (c.meta.subtitle) D.meta.subtitle = bil(c.meta.subtitle);
      if (c.meta.badge) D.meta.badge = bil(c.meta.badge);
      if (c.meta.difficulty) D.meta.difficulty = c.meta.difficulty;
    }
    if (c.overview) D.overview = bil(c.overview);
    if (c.notes) D.notes = { en: c.notes.en || c.notes.es || [], es: c.notes.es || c.notes.en || [] };
    if (Array.isArray(c.budget)) {
      D.budget = c.budget.map(function (row) {
        return [row[0], bil(row[1]) || { en: "", es: "" }, bil(row[2]) || { en: "", es: "" }, row[3] || "—", row[4] || "—"];
      });
    }
    var cr = c.rooms || {};
    D.rooms.forEach(function (r) {
      var x = cr[r.id]; if (!x) return;
      if (x.name) r.name = bil(x.name);
      if (x.see) r.see = bil(x.see);
      if (x.trap) r.trap = bil(x.trap); else delete r.trap;
      if (x.loot) r.loot = bil(x.loot); else delete r.loot;
      if (x.tac) r.tac = bil(x.tac); else delete r.tac;
      if (typeof x.secret === "boolean") r.secret = x.secret;
      if (x.mon && (x.mon.en || x.mon.es || Array.isArray(x.mon))) {
        var en = Array.isArray(x.mon) ? x.mon : (x.mon.en || x.mon.es || []);
        var es = Array.isArray(x.mon) ? x.mon : (x.mon.es || x.mon.en || []);
        if (en.length) { r.mon = { en: en, es: es }; r.tokens = DDG.tokensFor({ mon: en }); }
        else { delete r.mon; delete r.tokens; }
      } else { delete r.mon; delete r.tokens; }
    });
  }

  // ---- shell wiring --------------------------------------------------------
  // A map is only accepted from OUR shell: we must be embedded and the
  // message must come from the direct parent window (the shell relays the
  // Cartógrafo's map to us). This blocks a hostile page that embeds the
  // studio, or a sibling/opener, from injecting a map/image.
  var shellOrigin = null;
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object") return;
    if (d.type === "ddg-shell-hello" && e.source === window.parent) { shellOrigin = e.origin; return; }
    if (d.type === "ddg-map") {
      if (window.parent === window || e.source !== window.parent) return;      // not from our shell
      if (shellOrigin !== null && e.origin !== shellOrigin) return;            // origin drift
      if (d.data && d.bounds && d.png) handleMap(d);
    }
  });
  function announceReady() {
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: "ddg-studio-ready" }, "*"); } catch (e) {}
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", announceReady); else announceReady();

  DDG.integration = { openDescribe: openDescribe, mergeContent: mergeContent, dungeonFromMessage: dungeonFromMessage, _handleMap: handleMap };
})(typeof window !== "undefined" ? window : globalThis);

</script>
